---
# Builds the Wrecking Social app image on GitHub's machines and pushes it to
# ghcr.io. Coolify only pulls and runs it (docker-compose.coolify.yml), so the
# memory-hungry Next.js build never runs on the production server.
#
# After a successful build on main, this asks Coolify to redeploy, so the
# server always pulls the image that was just built. Coolify's own "deploy on
# push" is off for this app, because it fired before the image was ready.
# Needs the repository secret COOLIFY_TOKEN (a Coolify API token with only the
# "deploy" permission). Without it the deploy step is skipped.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      # Coolify resource wrecking--social:main (project "Wrecking Social")
      COOLIFY_DEPLOY_URL: https://coolify.dp7.app/api/v1/deploy?uuid=7ligbda79tveg3s6nj44sz48&force=false
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/mastodon7/wrecking-social:latest
            ghcr.io/mastodon7/wrecking-social:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy on Coolify
        if: github.ref == 'refs/heads/main' && env.COOLIFY_TOKEN != ''
        run: |
          curl --fail-with-body -sS --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_DEPLOY_URL"

      - name: Note skipped deploy
        if: github.ref == 'refs/heads/main' && env.COOLIFY_TOKEN == ''
        run: echo "::warning::COOLIFY_TOKEN secret is not set, so Coolify was not asked to deploy. Redeploy by hand in Coolify."

---
# Builds the Wrecking Social app image on GitHub's machines and pushes it to
# ghcr.io. Coolify only pulls and runs it (docker-compose.coolify.yml), so the
# memory-hungry Next.js build never runs on the production server.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/mastodon7/wrecking-social:latest
            ghcr.io/mastodon7/wrecking-social:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
